[package]
name = "rust-regex-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
# Requires regex crate source at ./vendor/regex.
# Run `./bench/build-shims.sh` to set up the symlink and build.
# Override via REGEX_CRATE_PATH env var if needed.
regex = { path = "./vendor/regex" }

[profile.release]
opt-level = 3
lto = true
